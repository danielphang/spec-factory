# Spec factory, P0 intake walking skeleton (spec-factory plans/P0-intake-skeleton.md).
# Harness config: the dispatcher script reads models and max_rounds through the clerk;
# the CLI enforces routing edges and round limits. A retro proposes changes here as a diff.
repo_name: nanobot
state_dir: knowledge_vault/spec_factory
request_dir: knowledge_vault/specs
protected_paths:
  infra: ["factory/workflows/**", "factory/config.yaml", "scripts/deploy*", "launchd/**"]
  dependencies: ["pyproject.toml", "uv.lock", "webui/package-lock.json"]
  credentials: ["~/.nanobot/**"]
  public_api: ["nanobot/api/**"]
gate_commands:
  - "uv run ruff check nanobot/"
  - "PYTHONDONTWRITEBYTECODE=1 COLUMNS=200 TERM=dumb NO_COLOR=1 uv run pytest -q -p no:cacheprovider tests/"
placeholders: {rounds: 2, spec_lines: 400, audit_n: 5, retro_min: 3}
max_rounds: {spec: 2, pr: 2}
models:
  triage: opus
  spec_writer: opus
  critic: fable
  planner: opus
  implementer: opus
  reviewer: fable
  verifier: opus
  retro: fable
  clerk: haiku
ready_state:
  triage: ready-for-triage
  spec_writer: ready-for-spec-writer
  critic: ready-for-critic
  planner: ready-for-planner
# Routing edges (doc §Routing table, intake half, plus the resolution rules). Anything else is refused.
routing:
  ready-for-triage: [ready-for-spec-writer, waiting-requester, parked, closed]
  waiting-requester: [ready-for-triage, closed]
  ready-for-spec-writer: [ready-for-critic, parked, closed]
  ready-for-critic: [ready-for-spec-writer, awaiting-spec-gate, parked, closed]
  awaiting-spec-gate: [ready-for-planner, ready-for-spec-writer, closed]
  ready-for-planner: [planned, parked, closed]
  parked: [ready-for-triage, ready-for-spec-writer, ready-for-critic, ready-for-planner, awaiting-spec-gate, closed]
  planned: [closed]
