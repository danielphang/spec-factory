escalations:
- 'A remote branch whose name only ends in `factory-store` can be mistaken for the store branch (`factory/gitops.py`
  `remote_branches`, used by `_add_store_checkout` in `factory/cli.py`). The function filters with `r.endswith(f"/{branch}")`.
  So a remote code branch such as `origin/feature/factory-store` is treated as the remote store branch.
  Reproduced: on a clone whose only such ref was `origin/feature/factory-store`, `init` exited 0. It checked
  that code branch out as the store, with upstream `origin/feature/factory-store`, and `.factory/state/code.txt`
  was present. Design A.3.2 specifies `refs/remotes/*/factory-store`, and git''s ref glob does not let
  `*` cross a `/`. The same matching would also refuse a clone that has both `origin/factory-store` and
  `origin/feature/factory-store` as "more than one remote". Suggested follow-up: match exactly `refs/remotes/<name>/factory-store`
  for each name `git remote` lists, or use `git for-each-ref refs/remotes/*/factory-store`, which is not
  the same when a remote''s name contains a slash. This sits outside T-0025.1''s acceptance criteria,
  so it does not change the verdict. It is a fix for the reviewer, or for T-0025.2, to pick up.'
