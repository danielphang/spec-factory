escalations:
- The cost of each `run finish` on a real machine is unmeasured (the PR lists this as a known gap). With
  `--transcripts`, every `run finish` lists all 8,828 transcript files on this machine and opens each
  file modified since the run started. On this machine 54 files (123 MB) changed in the last hour, many
  of them from other Claude Code sessions. `_opening` reads such a file until a user message names a run,
  so for a session that never names one it reads the whole file. A role run of an hour could make its
  `run finish` read on the order of 100 MB. This breaks no criterion of this sub-ticket. Operator step
  3, the first real Workflow run and drive run after the upgrade, is the place to time it.
- Suite time margin is thin under load. The gate's suite run took 185.97 s (exit 0); the timed scenario
  run took 126.75 s on the PR and 111.33 s on base, with load averages between 26 and 57 on 10 cores.
