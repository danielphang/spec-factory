escalations:
- 'The gate rule overcounts test-driven work. ST-2''s "gate fails fixed before hand-off" column comes
  from `gate_failures()` here. That function counts any Bash call whose command *contains* a gate command''s
  text, which is what the spec''s Decisions say. A gate such as `pytest ... tests/factory` is a prefix
  of the implementer''s own one-file runs, such as `pytest ... tests/factory/test_new.py`. So the "red"
  step of test-first work (a new test written to fail, then made to pass) counts as a gate failure fixed
  before hand-off. My probe shows exactly that: one red/green run of a single test file returned 1. The
  README limit planned for ST-3 names only the opposite error, a gate run in another form being missed.
  For the operator or the spec owner: either accept this inflation and state it beside that limit, or
  tighten the match (for example, require the gate text to be followed by end of command, a space, `)`,
  `|` or `;`). This is a design question for ST-2/ST-3. It does not affect this sub-ticket''s criteria.'
