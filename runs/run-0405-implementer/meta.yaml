escalations:
- 'The NEW criterion "A stopped driver ends its role process, records the run as killed and resumes from
  the stored state" expects `running=1`. With the approved design it prints `running=2`. Design.md A.7
  makes `last` the start step line `… start triage run-0001-triage`, and the `running` list also names
  that run, so the command''s `grep -c ''run-0001-triage''` counts both lines. A ruling is needed. I recommend
  amending the scenario to count only the `running` list, for example `grep -c ''^- run: run-0001-triage''`.
  The alternative is to change A.7 so that `last` or the start step leaves out the run id. The implementation
  is complete at 656c179 and needs no further change under the recommended amendment.'
