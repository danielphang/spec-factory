- Non-blocking design/test-ergonomics question, already reported by the implementer, and I confirmed it.
  The suite fails from any harness checkout that has an uncommitted edit under the harness paths (`23
  failed, 93 passed`). The cause is that the T-0012.3 and T-0012.4 tests drive own-store targets with
  this checkout's `bin/factory`, which C.4 refuses by design. Design C.4 says "a harness under development,
  which is uncommitted by definition, still runs its own tests against throwaway stores". That is true
  for the imported suite but not for these tests, so a developer must commit before the suite goes green.
  The gate runs on committed branches and is unaffected. A product decision is needed on whether the B/C
  tests should run on a clean clone or a throwaway store; that would be a later ticket.
