[project]
name = "spec-factory"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The suite runs across every CPU core so that one run stays well under the 10-minute limit of a single agent tool call.
addopts = "-n auto"
