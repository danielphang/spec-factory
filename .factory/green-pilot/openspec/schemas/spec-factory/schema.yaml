# Forked from OpenSpec's built-in `spec-driven` (doc §Harness, Spec store).
name: spec-factory
artifacts:
  - id: proposal
    generates: proposal.md
  - id: specs
    generates: specs/**/*.md
    requires: [proposal]
  - id: design
    generates: design.md
    requires: [proposal]
  - id: tasks
    generates: tasks.md
    requires: [specs, design]
  - id: verification
    generates: verification.md
    requires: [specs]
