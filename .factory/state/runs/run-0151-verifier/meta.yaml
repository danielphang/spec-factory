escalations:
- A `decisions.md` with no trailing newline corrupts the next entry. `record_decision` opens the file
  in append mode and writes `line + "\n"`. If the file's last byte is not a newline, as happens after
  a hand edit or a truncated write, the new decision is joined onto the previous line. I reproduced this
  with `decision add`. Archive behaved the same way before this change, so it is not a regression. But
  the new command invites hand-maintained logs, and the parent spec promises one line per decision. A
  follow-up could add a newline first whenever the file is non-empty and does not end with one. This needs
  an owner's call, not a fix in this ticket.
